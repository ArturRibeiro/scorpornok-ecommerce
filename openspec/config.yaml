schema: spec-driven

context: |
  Tech stack:

  Back-end (src/backend):
  - Plataforma: .NET 10 (C# latest), ASP.NET Core Minimal APIs, Swagger (Swashbuckle)
  - Arquitetura: DDD, CQRS com MediatR, domain notifications, event sourcing (Payments)
  - Validação: FluentValidation
  - Persistência: EF Core 10 + Npgsql (PostgreSQL 16), sem migrations (EnsureCreated + seeds)
  - Testes: NUnit, FluentAssertions, Moq, SpecFlow (BDD), WebApplicationFactory + Testcontainers
  - Versões de pacotes .NET centralizadas no Directory.Build.props

  Front-end (src/frontend):
  - Plataforma: SPA em React 19 + TypeScript 5.9, Vite 8, React Router 7, sem SSR
  - UI: Tailwind CSS 4 (@tailwindcss/vite, tokens em src/index.css), componentes shadcn/ui sobre Radix UI, ícones lucide-react, textos em pt-BR
  - Autenticação: oidc-client-ts (Keycloak, Authorization Code + PKCE, login num modal)
  - Tempo real: @microsoft/signalr (resultado do pagamento pelo hub do Orders, sem polling)
  - Dados: fetch direto do navegador para as APIs (URLs VITE_*_API_URL), hook useRequest; carrinho no localStorage
  - Qualidade: ESLint 9 (typescript-eslint, react-hooks); sem framework de testes, verificação por npm run build e npm run lint
  - Produção: build estático servido por nginx no compose (porta 3000)

  Infra:
  - Docker Compose (uma API e um Postgres por bounded context, mais a loja)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  specs:
    - Requisitos devem utilizar "DEVE" (deve/deverá).
    - Cenários devem utilizar a estrutura Given/When/Then.
    - Mantenha os detalhes de implementação no projeto, não nas especificações.
    - Seja objetivo e pouco verboso; um comportamento por requisito, com a descrição em até 3 frases.
    - Cenários cobrem só o que muda o resultado (caminho feliz, erros, limites); não repita o mesmo caso com outros dados.
  proposal:
    - Mantenha as propostas com menos de 500 palavras.
    - Sempre indique o que está fora do escopo.
    - Seja objetivo e pouco verboso; prefira itens de uma linha a parágrafos.
    - Não repita a mesma informação entre seções; nomes de arquivos, pacotes, variáveis e códigos HTTP ficam no design e nas specs.
  tasks:
    - As tarefas devem ter um escopo adequado para implementação e ser verificáveis.
    - Divida as tarefas em partes de, no máximo, 2 horas.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
operations:
  archive:
    guidance:
      - Summarize the archive outcome before finishing
