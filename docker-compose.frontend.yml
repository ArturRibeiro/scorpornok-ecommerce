# Front-end Next.js (src/frontend), servido em http://localhost:3000.
# Ainda não chama as APIs: os produtos vêm de src/frontend/data/products.json.
#
# Só o front-end:
#   docker compose -f docker-compose.frontend.yml up -d --build
services:
  frontend:
    build:
      context: src/frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - ecommerce-networks

networks:
  ecommerce-networks:
    driver: bridge
    # Mesma sub-rede de docker-compose.database.yml (veja o motivo lá),
    # para o arquivo também funcionar sozinho.
    ipam:
      config:
        - subnet: 192.168.100.0/24
