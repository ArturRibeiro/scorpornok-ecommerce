server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: rotas como /product/1 não existem em disco e caem no index.html,
    # onde o React Router decide o que mostrar.
    location / {
        try_files $uri /index.html;
    }

    # Os arquivos de assets/ têm hash no nome, então podem ficar em cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fotos dos produtos (o nome é o Sku, sem hash). Ficam 30 dias em cache no navegador;
    # depois ele revalida pelo ETag e recebe 304 se a imagem não mudou. Imagem inexistente
    # responde 404, em vez de cair no index.html da SPA.
    location /catalog-imgs/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }
}
