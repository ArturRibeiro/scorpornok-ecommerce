server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: rotas como /product/1 não existem em disco e caem no index.html,
    # onde o React Router decide o que mostrar.
    location / {
        try_files $uri /index.html;
    }

    # Os arquivos de assets/ têm hash no nome, então podem ficar em cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
