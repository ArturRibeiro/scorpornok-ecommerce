# Aplicação: sobe as APIs (Catalog, Orders, Payments e Customers) e o gateway GraphQL junto com os bancos de docker-compose.database.yml,
# o RabbitMQ de docker-compose.messaging.yml, o Mailpit de docker-compose.mail.yml,
# o Keycloak de docker-compose.identity.yml e o front-end de docker-compose.frontend.yml.
#   docker compose up -d --build
include:
  - docker-compose.database.yml
  - docker-compose.messaging.yml
  - docker-compose.mail.yml
  - docker-compose.identity.yml
  - docker-compose.frontend.yml

services:
  catalog-api:
    build:
      context: .
      args:
        PROJECT: src/backend/Catalog/Catalog.Web.Api/Catalog.Web.Api.csproj
        ASSEMBLY: Catalog.Web.Api
    container_name: catalog_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConnectionString: Host=catalog-db;Port=5432;Database=catalog;Username=sa;Password=sa
    ports:
      - 5064:8080
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - ecommerce-networks

  # Ponto de entrada GraphQL único da loja (Fusion): junta os subgraphs (Catalog, Customers, Orders e Payments) em /graphql.
  # O gateway.compose.far tem o endereço deles na rede interna (catalog-api, customers-api, orders-api e payment-api, porta 8080); veja o
  # scripts/compose-gateway.sh. Valida o token do Keycloak (audience gateway-api) e o repassa aos subgraphs.
  gateway-api:
    build:
      context: .
      args:
        PROJECT: src/backend/Gateway/Gateway.Web.Api/Gateway.Web.Api.csproj
        ASSEMBLY: Gateway.Web.Api
    container_name: gateway_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Fusion__Archive: gateway.compose.far
      # Mesmo emissor público dos tokens; a descoberta e as chaves vêm de keycloak:8080.
      Keycloak__MetadataAddress: http://keycloak:8080/realms/scorponok/.well-known/openid-configuration
    ports:
      - 5200:8080
    depends_on:
      catalog-api:
        condition: service_started
      customers-api:
        condition: service_started
      orders-api:
        condition: service_started
      payment-api:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - ecommerce-networks

  orders-api:
    build:
      context: .
      args:
        PROJECT: src/backend/Store/Orders.Web.Api/Orders.Web.Api.csproj
        ASSEMBLY: Orders.Web.Api
    container_name: orders_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConnectionString: Host=orders-db;Port=5432;Database=orders;Username=sa;Password=sa
      # Preço, nome e foto dos itens do pedido vêm do Catalog, pela rede interna.
      Catalog__BaseAddress: http://catalog-api:8080
      RabbitMq__Host: rabbitmq
      # API de gerenciamento do RabbitMQ, usada pelo /health/ops para olhar as filas de erro.
      RabbitMq__ManagementUrl: http://rabbitmq:15672
      # Pedido pendente além do prazo: o Orders consulta o Payments (veja o CLAUDE.md). Os
      # valores podem vir do .env, por exemplo para testar com um prazo curto.
      PaymentCheck__TimeoutMinutes: ${PAYMENT_CHECK_TIMEOUT_MINUTES:-15}
      PaymentCheck__IntervalSeconds: ${PAYMENT_CHECK_INTERVAL_SECONDS:-60}
      PaymentCheck__AlertAfterMinutes: ${PAYMENT_CHECK_ALERT_AFTER_MINUTES:-15}
      # O emissor dos tokens é o endereço público (localhost:8080, do appsettings.json);
      # de dentro do container, a descoberta e as chaves vêm de keycloak:8080.
      Keycloak__MetadataAddress: http://keycloak:8080/realms/scorponok/.well-known/openid-configuration
      # Mailpit por padrão. Para enviar de verdade (ex.: Gmail), defina SMTP_* num .env
      # na raiz (fora do git); veja o CLAUDE.md.
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__From: ${SMTP_FROM:-store@scorponok.local}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-false}
    ports:
      - 5224:8080
    depends_on:
      catalog-api:
        condition: service_started
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      keycloak:
        condition: service_healthy
      # A fila order-placed é criada quando o customers-api sobe; o OrderPlaced publicado antes
      # disso seria descartado.
      customers-api:
        condition: service_started
    networks:
      - ecommerce-networks

  payment-api:
    build:
      context: .
      args:
        PROJECT: src/backend/Payments/Payments.Web.Api/Payments.Web.Api.csproj
        ASSEMBLY: Payments.Web.Api
    container_name: payment_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConnectionString: Host=payment-db;Port=5432;Database=payment;Username=sa;Password=sa
      RabbitMq__Host: rabbitmq
      # API de gerenciamento do RabbitMQ, usada pelo /health/ops para olhar as filas de erro.
      RabbitMq__ManagementUrl: http://rabbitmq:15672
    ports:
      - 5220:8080
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-networks

  customers-api:
    build:
      context: .
      args:
        PROJECT: src/backend/Customers/Customers.Web.Api/Customers.Web.Api.csproj
        ASSEMBLY: Customers.Web.Api
    container_name: customers_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConnectionString: Host=customers-db;Port=5432;Database=customers;Username=sa;Password=sa
      # Consome o OrderPlaced do Orders (histórico de endereços e cadastro da primeira compra).
      RabbitMq__Host: rabbitmq
      # Mesmo emissor público dos tokens; a descoberta e as chaves vêm de keycloak:8080.
      Keycloak__MetadataAddress: http://keycloak:8080/realms/scorponok/.well-known/openid-configuration
    ports:
      - 5230:8080
    depends_on:
      customers-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - ecommerce-networks
