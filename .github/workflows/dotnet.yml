name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Os cenários do SpecFlow sobem o Catalog.Web.Api real, que usa o banco do
    # appsettings.Development.json (localhost:5433, catalog, sa/sa), como o catalog-db do compose.
    services:
      catalog-db:
        image: postgres:16
        env:
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: sa
          POSTGRES_DB: catalog
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sa -d catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
