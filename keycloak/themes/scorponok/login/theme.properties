# Tema das telas de login, cadastro e definição de senha do realm scorponok.
# Herda o keycloak.v2 (PatternFly 5) e só troca as cores, a fonte e a marca,
# para seguir o visual da loja (src/frontend/src/index.css).
parent=keycloak.v2
import=common/keycloak

# O styles.css vem do keycloak.v2 (os recursos são procurados na herança);
# o scorponok.css, carregado depois, sobrescreve o que precisa.
styles=css/styles.css css/scorponok.css

# A loja não tem tema escuro.
darkMode=false

locales=pt-BR
